<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>🧠 DocAssist</h1>
                <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            </div>

            <div class="config-section">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="sk-or-v1-..." />

                <label>Base URL</label>
                <input type="text" id="baseUrl" value="https://openrouter.ai/api/v1" />

                <label>Model</label>
                <select id="modelSelect">
                    {% for m in models %}
                    <option value="{{ m.id }}">{{ m.name }} — {{ m.provider }} ({{ m.ctx }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="upload-section">
                <label>Documents</label>
                <div class="dropzone" id="dropzone">
                    <input type="file" id="fileInput" multiple accept=".pdf,.txt,.csv,.docx" hidden />
                    <div class="dropzone-content">
                        <span class="dropzone-icon">📁</span>
                        <p>Drop files or click to browse</p>
                        <span class="dropzone-hint">PDF, TXT, CSV, DOCX</span>
                    </div>
                </div>
                <div id="fileList" class="file-list"></div>
                <button class="btn-primary" id="processBtn" onclick="uploadFiles()" disabled>
                    Process Documents
                </button>
                <div id="uploadStatus" class="status"></div>
            </div>

            <div class="sidebar-footer">
                <div class="status-badge" id="statusBadge">● No documents</div>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <h2>AI Document Assistant</h2>
                <p>Upload documents and ask questions</p>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <div class="welcome-icon">🧠</div>
                    <h3>Welcome!</h3>
                    <p>Upload documents in the sidebar, then ask questions about their content.</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea id="questionInput" placeholder="Ask about your documents..." rows="1"
                        onkeydown="handleKey(event)"></textarea>
                    <button class="send-btn" onclick="askQuestion()" id="sendBtn" disabled>
                        <span>→</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
